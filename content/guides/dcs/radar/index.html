---
title: Interactive Radar Trainer (F/A-18C)
summary: An interactive tool for learning the basics of the air-to-air radar in the DCS F/A-18C Hornet.
tags:
    - digital combat simulator
weight: 6
date: 2026-06-01
---

<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="radar.css" />
    </head>
    <body>
        <div class="radar-app">
            <canvas id="scene3d" class="scene3d"></canvas>

            <div class="mfd-row">
                <canvas id="mfd-azel" class="mfd"></canvas>
                <canvas id="mfd-sa" class="mfd"></canvas>
                <canvas id="mfd-atk" class="mfd"></canvas>
            </div>

            <div class="status" id="status"></div>

            <div class="hotas-row">
                <div class="hotas-group">
                    <div id="tdc-pad" class="tdc-pad">
                        <div id="tdc-knob" class="tdc-knob"></div>
                    </div>
                    <span class="hotas-label">TDC SLEW</span>
                </div>

                <div class="hotas-group">
                    <button id="tdc-depress" class="hotas-btn">TDC<br />DEPRESS</button>
                    <span class="hotas-label">DESIGNATE L&amp;S</span>
                </div>

                <div class="hotas-group">
                    <div class="rocker">
                        <button id="elev-up" class="hotas-btn">▲</button>
                        <span class="rocker-mid">ELEV</span>
                        <button id="elev-dn" class="hotas-btn">▼</button>
                    </div>
                    <span class="hotas-label">ANTENNA ELEV</span>
                </div>

                <div class="hotas-group">
                    <button id="undesig" class="hotas-btn">UNDESIG</button>
                    <span class="hotas-label">STEP L&amp;S</span>
                </div>
            </div>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/three.module.js",
                    "three/addons/": "./vendor/addons/"
                }
            }
        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
