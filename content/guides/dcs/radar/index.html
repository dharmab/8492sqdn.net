---
title: "Radar Trainer for DCS: F/A-18C"
summary: An interactive tool for learning the basics of the air-to-air radar
tags:
    - digital combat simulator
weight: 6
date: 2026-06-08
---

<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="radar.css" />
    </head>
    <body>
        <div class="radar-app">
            <canvas id="scene3d" class="scene3d"></canvas>

            <div class="mfd-row">
                <canvas id="mfd-azel" class="mfd"></canvas>
                <canvas id="mfd-sa" class="mfd"></canvas>
                <canvas id="mfd-atk" class="mfd"></canvas>
            </div>

<div class="hotas-row">
                <div class="hotas-group">
                    <div id="tdc-pad" class="tdc-pad">
                        <div id="tdc-knob" class="tdc-knob"></div>
                    </div>
                    <span class="hotas-label">TDC SLEW</span>
                </div>

                <div class="hotas-group">
                    <button id="tdc-depress" class="hotas-btn">
                        TDC<br />DEPRESS
                    </button>
                </div>

                <div class="hotas-group">
                    <div class="rocker">
                        <button id="elev-up" class="hotas-btn">▲</button>
                        <span class="rocker-mid">ANT ELEV</span>
                        <button id="elev-dn" class="hotas-btn">▼</button>
                    </div>
                </div>

                <div class="hotas-group">
                    <button id="undesig" class="hotas-btn">UNDESIGNATE</button>
                </div>

                <div class="hotas-group">
                    <div class="scs-pad">
                        <button id="scs-up"    class="hotas-btn scs-btn">▲</button>
                        <button id="scs-left"  class="hotas-btn scs-btn">◀</button>
                        <div class="scs-center"></div>
                        <button id="scs-right" class="hotas-btn scs-btn">▶</button>
                        <button id="scs-down"  class="hotas-btn scs-btn">▼</button>
                    </div>
                    <span class="hotas-label">SCS</span>
                </div>
            </div>

            <div class="assists-row">
                <label><input type="checkbox" id="assist-3d" checked /> Show scan volume on 3D view</label>
                <label><input type="checkbox" id="assist-sa-cone" checked /> Show scan volume on SA page</label>
                <label><input type="checkbox" id="assist-ltws" /> Enable LTWS</label>
            </div>
        </div>

        <script type="importmap">
            {
                "imports": {
                    "three": "./vendor/three.module.js",
                    "three/addons/": "./vendor/addons/"
                }
            }
        </script>
        <script type="module" src="main.js"></script>
    </body>
</html>
